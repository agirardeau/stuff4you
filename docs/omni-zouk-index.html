"Lambada", "", 2, "", "Can't wait to see you all tonight for Week 2! \nTonight is the last class for drop in this month (our classes run on monthly cycles; weeks 1 and 2 are open for drop-in while weeks 3 and 4 are closed only for folks who have bought a 4 class pass) so make sure to invite your friends tonight!\nAnd finallyyyyy...I want to drop in a little tidbit about Brazilian Zouk's most recent \u0026 direct ancestor: Lambada! Here's a quick read from the Brazilian Zouk Dance Council:\n\"In the 80\u2019s, Lambada was very popular in Brazil and quickly gained worldwide notoriety through its music, especially because of the popularity of the band Kaoma, Beto Barbosa, among others, and different styles of music such as Samba-Reggae, Caribbean Zouk, Flamenco music, mainly Gipsy Kings, among others. TV shows, films and DJ\u2019s also helped promote the dance and the music. [...] Lambada\u2019s popularity began to decline in the 90\u2019s, and the remaining lovers began to use primarily Zouk Caribbean music to continue dancing Lambada. During this period people naturally began to call the dance French Lambada, because of the music being sung in French Creole. Following that the community began to call the dance Zouk.\"\nThe primary difference between Lambada and Zouk is on which beats we step. In a lambada dance, we dance 'on the quick'; this means we step according to the pattern, quick quick slow or 1\u0026 2. In a brazilian zouk dance, we dance 'on the slow'; this means we step according to the pattern, slow quick quick or 1 2\u0026. Today, zouk and lambada have more crossover than ever, but it is important to note that zouk is an evolution of lambada, and lambada is an evolution of several Afro-Brazilian dances like the Jongo, Lundu, and Maxixe. \n\nLambada Performance with Hudson \u0026 Jessica, Arthur \u0026 Grace: ", "Julie"], ["2022 Feb 6", "https://www.facebook.com/watch/?v=1146543742753229\nhttps://www.facebook.com/groups/632607011367731/posts/634630411165391/", "Basic in place, frente e tras, and rotating basic; Viradinhas, Laterals, lunges, \u0026 simple turns; bonus or boomerang", "", 1, "", "Demo from Week 1 of Level 1A! Here's the play-by-play of the first video:\n1. 0:00 - 0:25 Level 1A Week 1 material! Basic in place, frente e tras, and rotating basic\n1. 0:29 - 0:50 Sneak peek of more Level 1A material! We also reviewed these movements in Level 2A Week 1. Viradinhas, Laterals, lunges, \u0026 simple turns\n1. 0:50 - 0:56 Sneak peek of Level 2A material! We will break down the components of the movement known as 'bonus' or 'boomerang'\n\nThe rest of the demo is a mixture of Level 1, 2, and eventually what will become level 3 material! We imagine level 3 to cover some of the head movements you see here - so stick with us to learn some cool shit! \n\nIf someone has a video of the Level 1 and 2 Week 1 recaps, please help us out by posting them in this group \u003c3", "Julie"], ["2022 Feb 6", "https://www.facebook.com/watch/?v=3178219389093585\nhttps://www.facebook.com/groups/632607011367731/posts/634630411165391/", "Basic in place, frente e tras, and rotating basic; Viradinhas, Laterals, lunges, \u0026 simple turns; bonus or boomerang", "", 1, "", "Demo from Week 1 of Level 1A! Here's the play-by-play of the first video:\n1. 0:00 - 0:25 Level 1A Week 1 material! Basic in place, frente e tras, and rotating basic\n1. 0:29 - 0:50 Sneak peek of more Level 1A material! We also reviewed these movements in Level 2A Week 1. Viradinhas, Laterals, lunges, \u0026 simple turns\n1. 0:50 - 0:56 Sneak peek of Level 2A material! We will break down the components of the movement known as 'bonus' or 'boomerang'\n\nThe rest of the demo is a mixture of Level 1, 2, and eventually what will become level 3 material! We imagine level 3 to cover some of the head movements you see here - so stick with us to learn some cool shit! \n\nIf someone has a video of the Level 1 and 2 Week 1 recaps, please help us out by posting them in this group \u003c3", "Julie"]];
const headers = ["Date posted", "Links", "Subject", "Level", "Week", "Teachers", "Post text", "Poster"];
const normalize = value => String(value).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const grid = new gridjs.Grid({columns: headers.map((name, i) => i === 1 ? {name, formatter: cell => {
  const links = cell.split('\n').map((url, i) => {
    if (!/^https?:\/\//i.test(url)) return '';
    const a = document.createElement('a'); a.href = url; a.textContent = i === 0 ? 'video' : 'post';
    return a.outerHTML;
  }).filter(Boolean);
  return gridjs.html(links.join(', '));
}} : i === 6 ? {name, formatter: cell => {
  if (cell.length <= 110) return cell;
  const wrapper = document.createElement('span');
  wrapper.append(document.createTextNode(cell.slice(0, 100) + '... '));
  const tooltip = document.createElement('button'); tooltip.type = 'button'; tooltip.className = 'full-post'; tooltip.title = cell;
  tooltip.textContent = 'full';
  wrapper.append(document.createTextNode('['), tooltip, document.createTextNode(']'));
  return gridjs.html(wrapper.outerHTML);
}} : name), data: rows, sort: true, pagination: {limit: 50}});
grid.render(document.getElementById('table'));
document.getElementById('search').addEventListener('input', event => {
  const query = normalize(event.target.value);
  grid.updateConfig({data: rows.filter(row => row.some(cell => normalize(cell).includes(query)))}).forceRender();
});
</script><script>
let postPopover;
function closePostPopover() { if (postPopover) { postPopover.remove(); postPopover = null; } }
document.addEventListener('click', event => {
  const button = event.target.closest('.full-post');
  if (!button) { if (!event.target.closest('.post-popover')) closePostPopover(); return; }
  const wasOpen = postPopover && postPopover.trigger === button;
  closePostPopover();
  if (wasOpen) return;
  postPopover = document.createElement('div');
  postPopover.className = 'post-popover';
  postPopover.textContent = button.title;
  postPopover.trigger = button;
  document.body.append(postPopover);
  const rect = button.getBoundingClientRect();
  postPopover.style.left = Math.max(10, Math.min(rect.left, window.innerWidth - postPopover.offsetWidth - 10)) + 'px';
  postPopover.style.top = Math.max(10, Math.min(rect.bottom + 4, window.innerHeight - postPopover.offsetHeight - 10)) + 'px';
});
document.addEventListener('keydown', event => { if (event.key === 'Escape') closePostPopover(); });
</script></body></html>
